<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="img/icon.PNG">
    <meta charset="utf-8">
    <meta name="authors" content="kisevt, ikuzne">
    <title>Welcome•FinCheck</title>
</head>
<body>
    <header>
        <img src="img/logo.png" width="200px">
    </header>
    <div class="content-center">
        <div class="welcome_div">
            <form id="welcome_frm" action="dashboard.html">
                <h1 class="welcome-txt">Welcome to FinCheck</h1>
                <input class="form_field" type="text" placeholder="email" required>
                <br>
                <input class="form_field" type="password" placeholder="password" required>
                <br>
                <input type="submit" class="btn" value="Login">
            </form>
            <div id="sign-up-container" class="sign-up-text">
                <span id="sign-up-text">Don't have an account?</span>
                <a href="registration.html" class="sign-up-link">Sign Up</a>
            </div>
        </div>
    </div>
    
</body>
</html>
